tables:
  - name: customer
    columns:
      - name: customer_id
        type: integer
      - name: first_name
        type: string
      - name: last_name
        type: string
    primary_key: customer_id

  - name: customer_contact
    columns:
      - name: customer_id
        type: integer
      - name: contact_number
        type: string
    primary_key: [customer_id, contact_number]

  - name: customer_address
    columns:
      - name: customer_id
        type: integer
      - name: address_type
        type: string
      - name: line_1
        type: string
      - name: line_2
        type: string
      - name: city
        type: string
      - name: state
        type: string
      - name: zip
        type: string
    primary_key: [customer_id, address_type]

  - name: order
    columns:
      - name: order_id
        type: integer
      - name: order_timestamp
        type: timestamp
      - name: customer_id
        type: integer
      - name: order_mode
        type: string
      - name: order_status
        type: string
      - name: return_windows_days
        type: integer
      - name: discount_percentage
        type: float
      - name: shipping_label
        type: string
    primary_key: order_id

  - name: order_item
    columns:
      - name: order_id
        type: integer
      - name: product_id
        type: integer
      - name: quantity
        type: integer
    primary_key: [order_id, product_id]

  - name: product
    columns:
      - name: id
        type: integer
      - name: name
        type: string
      - name: category
        type: string
      - name: cost
        type: float
      - name: price
        type: float
      - name: stock
        type: integer
    primary_key: id

  - name: returns
    columns:
      - name: order_id
        type: integer
      - name: return_request_timestamp
        type: timestamp
      - name: return_reason
        type: string
      - name: return_status
        type: string
    primary_key: order_id

  - name: return_item
    columns:
      - name: order_id
        type: integer
      - name: product_id
        type: integer
      - name: quantity_received
        type: integer
    primary_key: [order_id, product_id]
