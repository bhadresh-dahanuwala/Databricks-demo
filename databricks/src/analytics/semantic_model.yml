semantic_models:

  # ---------------------------------------------------------
  # DIMENSIONS
  # ---------------------------------------------------------

  - name: customer
    description: "The core customer dimension holding slowly-changing, identity-level attributes. Used to analyze purchasing behavior across unique individuals."
    model: ref('customer_dim')
    entities:
      - name: customer
        type: primary
        expr: customer_key
    dimensions:
      - name: customer_id
        type: categorical
        description: "The natural, business identifier for the customer."
      - name: first_name
        type: categorical
        description: "The customer's given first name."
      - name: last_name
        type: categorical
        description: "The customer's given surname."

  - name: address
    description: "Deduplicated physical location conformed dimension. Analyzes geographical distribution of orders and returns."
    model: ref('address_dim')
    entities:
      - name: address
        type: primary
        expr: address_key
    dimensions:
      - name: city
        type: categorical
        description: "The standardized city name of the location."
      - name: state
        type: categorical
        description: "The state or regional province of the location."
      - name: zip
        type: categorical
        description: "The postal code."

  - name: product
    description: "Descriptive product catalog attributes. Used to slice metrics by product offerings."
    model: ref('product_dim')
    entities:
      - name: product
        type: primary
        expr: product_key
    dimensions:
      - name: product_category
        type: categorical
        description: "The top-level hierarchical category the product belongs to (e.g., Electronics, Apparel)."
      - name: product_name
        type: categorical
        description: "The consumer-facing name of the product."

  - name: order_attributes
    description: "Stable context attributes set at the time an order is placed."
    model: ref('order_dim')
    entities:
      - name: order
        type: primary
        expr: order_key
    dimensions:
      - name: order_mode
        type: categorical
        description: "The channel through which the order was placed (e.g., Online, Phone, App)."
      - name: return_windows_days
        type: categorical
        description: "The number of days the customer has to validly return the items in this order."

  - name: order_status
    description: "The current state of an order in the fulfillment pipeline."
    model: ref('order_status_dim')
    entities:
      - name: order_status
        type: primary
        expr: order_status_key
    dimensions:
      - name: status
        type: categorical
        expr: order_status
        description: "The lifecycle stage of the order (e.g., Processing, Shipped, Delivered)."

  - name: return_reason
    description: "Contextual attributes indicating why a return was initiated."
    model: ref('order_return_dim')
    entities:
      - name: order_return
        type: primary
        expr: order_return_key
    dimensions:
      - name: reason
        type: categorical
        expr: return_reason
        description: "The primary reason cited by the customer for returning the order (e.g., Defective, Wrong Size)."

  # ---------------------------------------------------------
  # FACTS
  # ---------------------------------------------------------

  - name: order_item_fct
    description: "The core accumulating snapshot fact table for order line items. This represents the lowest grain of purchasing behavior."
    model: ref('order_item_fct')
    defaults:
      agg_time_dimension: order_date

    entities:
      - name: order_item
        type: primary
        expr: order_item_key
      - name: order
        type: foreign
        expr: order_key
      - name: product
        type: foreign
        expr: product_key
      - name: customer
        type: foreign
        expr: customer_key
      - name: address
        type: foreign
        expr: customer_address_key
      - name: order_status
        type: foreign
        expr: order_status_key

    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
        expr: TO_DATE(CAST(order_date_key AS STRING), 'yyyyMMdd')
        description: "The date the order was finalized."
      - name: shipping_label
        type: categorical
        description: "The tracking or fulfillment label associated with the shipment of this item."

    measures:
      - name: order_item_gross_amount
        description: "Total gross revenue generated by the line item before any discounts are applied."
        agg: sum
        expr: gross_amount
      - name: order_item_net_amount
        description: "Total net revenue generated by the line item after discounts have been factored in."
        agg: sum
        expr: net_amount
      - name: items_sold
        description: "Total quantity of products sold in the line item."
        agg: sum
        expr: quantity
      - name: days_to_ship
        description: "Total days taken to ship. Used alongside count to calculate average shipping times."
        agg: sum
        expr: days_to_ship
      - name: shipped_items_count
        description: "Count of items that have a valid days_to_ship value."
        agg: count
        expr: days_to_ship

  - name: return_item_fct
    description: "Fact table recording returned line items. Tracks the financial liability and inventory impact of reverse logistics."
    model: ref('return_item_fct')
    defaults:
      agg_time_dimension: return_request_date

    entities:
      - name: return_item
        type: primary
        expr: return_item_key
      - name: order
        type: foreign
        expr: order_key
      - name: product
        type: foreign
        expr: product_key
      - name: customer
        type: foreign
        expr: customer_key
      - name: address
        type: foreign
        expr: customer_address_key
      - name: order_return
        type: foreign
        expr: order_return_key

    dimensions:
      - name: return_request_date
        type: time
        type_params:
          time_granularity: day
        expr: TO_DATE(CAST(return_request_date_key AS STRING), 'yyyyMMdd')
        description: "The date the customer officially requested the return."

    measures:
      - name: items_returned
        description: "Total physical quantity of items received back at the warehouse."
        agg: sum
        expr: quantity_received
      - name: total_return_cost
        description: "The base cost associated with the returned items, added back to inventory value."
        agg: sum
        expr: return_cost_amount
      - name: total_return_amount
        description: "The monetary refund owed to the customer for the returned items (factors in original discounts)."
        agg: sum
        expr: return_amount

  - name: product_inventory_fct
    description: "State-change fact table tracking inventory levels, cost pricing, and retail pricing of products."
    model: ref('product_fct')
    
    entities:
      - name: product
        type: foreign
        expr: product_key
        
    dimensions:
      - name: is_active
        type: categorical
        expr: __ACTIVE
        description: "Indicates if this is the currently active pricing and stock record for the product."
        
    measures:
      - name: current_stock_quantity
        description: "The volume of inventory currently residing in the warehouse for the active product slice."
        agg: sum
        expr: case when __ACTIVE = true then stock_quantity else 0 end

# ---------------------------------------------------------
# METRICS (Business Logic)
# ---------------------------------------------------------

metrics:
  - name: total_revenue
    description: "The ultimate top-line revenue metric. Total net amount collected from orders."
    type: simple
    type_params:
      measure: order_item_net_amount

  - name: total_refunds
    description: "The total monetary amount refunded to customers due to returns."
    type: simple
    type_params:
      measure: total_return_amount

  - name: net_retained_revenue
    description: "The actual realized revenue after factoring in customer refunds."
    type: derived
    type_params:
      expr: total_revenue - total_refunds
      metrics:
        - name: total_revenue
        - name: total_refunds

  - name: average_shipping_delay
    description: "The average number of days it takes for an order item to be shipped out."
    type: derived
    type_params:
      expr: days_to_ship / NULLIF(shipped_items_count, 0)
      metrics:
        - name: days_to_ship
        - name: shipped_items_count

  - name: return_rate_by_volume
    description: "The ratio of physical items returned against the physical items initially sold."
    type: derived
    type_params:
      expr: items_returned / NULLIF(items_sold, 0)
      metrics:
        - name: items_returned
        - name: items_sold
