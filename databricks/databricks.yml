bundle:
  name: ecomm_bundle

variables:
  catalog:
    description: Catalog name
    default: ecomm

resources:
  pipelines:
    customer_raw_pipeline:
      name: "Customer Raw Ingestion"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: raw
      configuration:
        entity_name: "customer"
      libraries:
        - file:
            path: ./src/raw/generic_ingestion.py

    product_raw_pipeline:
      name: "Product Raw Ingestion"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: raw
      configuration:
        entity_name: "product"
      libraries:
        - file:
            path: ./src/raw/generic_ingestion.py

    order_raw_pipeline:
      name: "Order Raw Ingestion"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: raw
      configuration:
        entity_name: "order"
      libraries:
        - file:
            path: ./src/raw/generic_ingestion.py

    order_item_raw_pipeline:
      name: "Order Item Raw Ingestion"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: raw
      configuration:
        entity_name: "order_item"
      libraries:
        - file:
            path: ./src/raw/generic_ingestion.py

    return_raw_pipeline:
      name: "Return Raw Ingestion"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: raw
      configuration:
        entity_name: "return"
      libraries:
        - file:
            path: ./src/raw/generic_ingestion.py

    return_item_raw_pipeline:
      name: "Return Item Raw Ingestion"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: raw
      configuration:
        entity_name: "return_item"
      libraries:
        - file:
            path: ./src/raw/generic_ingestion.py

    # --- New: staging pipeline applying the explicit schema contract -------
    customer_staging_pipeline:
      name: "Customer Staging Transformation"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: staging
      libraries:
        - file:
            path: ./src/staging/customer.py

    order_staging_pipeline:
      name: "Order Staging Transformation"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: staging
      libraries:
        - file:
            path: ./src/staging/order.py

    order_item_staging_pipeline:
      name: "Order Item Staging Transformation"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: staging
      libraries:
        - file:
            path: ./src/staging/order_item.py

    returns_staging_pipeline:
      name: "Returns Staging Transformation"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: staging
      libraries:
        - file:
            path: ./src/staging/returns.py

    return_item_staging_pipeline:
      name: "Return Item Staging Transformation"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: staging
      libraries:
        - file:
            path: ./src/staging/return_item.py

    order_item_intermediate_pipeline:
      name: "Order Item Intermediate Transformation"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: intermediate
      libraries:
        - file:
            path: ./src/intermediate/order_item.sql

  jobs:
    trigger_raw_ingestion:
      name: "Trigger Raw Ingestion on File Arrival"
      trigger:
        file_arrival:
          url: /Volumes/${var.catalog}/raw/raw_vol/
      tasks:
        - task_key: run_customer_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.customer_raw_pipeline.id}
        - task_key: run_product_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.product_raw_pipeline.id}
        - task_key: run_order_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.order_raw_pipeline.id}
        - task_key: run_order_item_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.order_item_raw_pipeline.id}
        - task_key: run_return_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.return_raw_pipeline.id}
        - task_key: run_return_item_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.return_item_raw_pipeline.id}
        # New: run customer staging only after customer raw ingestion succeeds
        - task_key: run_customer_staging_pipeline
          depends_on:
            - task_key: run_customer_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.customer_staging_pipeline.id}
        - task_key: run_order_staging_pipeline
          depends_on:
            - task_key: run_order_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.order_staging_pipeline.id}
        - task_key: run_order_item_staging_pipeline
          depends_on:
            - task_key: run_order_item_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.order_item_staging_pipeline.id}
        - task_key: run_returns_staging_pipeline
          depends_on:
            - task_key: run_return_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.returns_staging_pipeline.id}
        - task_key: run_return_item_staging_pipeline
          depends_on:
            - task_key: run_return_item_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.return_item_staging_pipeline.id}
        - task_key: run_order_item_intermediate_pipeline
          depends_on:
            - task_key: run_order_staging_pipeline
            - task_key: run_order_item_staging_pipeline
            - task_key: run_product_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.order_item_intermediate_pipeline.id}
