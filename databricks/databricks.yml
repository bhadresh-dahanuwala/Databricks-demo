bundle:
  name: ecomm_bundle

variables:
  catalog:
    description: Catalog name
    default: ecomm

resources:
  pipelines:
    ecomm_raw_pipeline:
      name: "E-Commerce Raw Ingestion Pipeline"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: raw
      libraries:
        - file:
            path: ./src/raw/generic_ingestion.py

    ecomm_staging_pipeline:
      name: "E-Commerce Staging Pipeline"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: staging
      libraries:
        - file:
            path: ./src/staging/customer.py
        - file:
            path: ./src/staging/order.py
        - file:
            path: ./src/staging/order_item.py
        - file:
            path: ./src/staging/product.py
        - file:
            path: ./src/staging/returns.py
        - file:
            path: ./src/staging/return_item.py

    ecomm_intermediate_pipeline:
      name: "E-Commerce Intermediate Pipeline"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: intermediate
      libraries:
        - file:
            path: ./src/intermediate/addresses.py
        - file:
            path: ./src/intermediate/order_items.py
        - file:
            path: ./src/intermediate/return_items.py

    ecomm_analytics_pipeline:
      name: "E-Commerce Analytics Pipeline"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: analytics
      libraries:
        - file:
            path: ./src/analytics/customer_contact_dim.py

  jobs:
    trigger_raw_ingestion:
      name: "Trigger Raw Ingestion on File Arrival"
      trigger:
        file_arrival:
          url: /Volumes/${var.catalog}/raw/raw_vol/
      tasks:
        - task_key: run_raw_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.ecomm_raw_pipeline.id}
        - task_key: run_staging_pipeline
          depends_on:
            - task_key: run_raw_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.ecomm_staging_pipeline.id}
        - task_key: run_intermediate_pipeline
          depends_on:
            - task_key: run_staging_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.ecomm_intermediate_pipeline.id}
        - task_key: run_analytics_pipeline
          depends_on:
            - task_key: run_intermediate_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.ecomm_analytics_pipeline.id}
