bundle:
  name: ecomm_bundle

variables:
  catalog:
    description: Catalog name
    default: ecomm

resources:
  pipelines:
    customer_raw_ingestion:
      name: "Customer Raw Ingestion Pipeline"
      serverless: true
      development: true 
      continuous: false
      catalog: ${var.catalog}
      schema: raw
      libraries:
        - file:
            path: ./src/raw/customer.py

  jobs:
    trigger_customer_ingestion:
      name: "Trigger Customer Ingestion on File Arrival"
      trigger:
        file_arrival:
          url: /Volumes/${var.catalog}/raw/raw_vol/
      tasks:
        - task_key: run_dlt_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.customer_raw_ingestion.id}
