resources:
  pipelines:
    ecomm_analytics_pipeline:
      name: "E-Commerce Analytics Pipeline"
      serverless: true
      development: true
      continuous: false
      catalog: ${var.catalog}
      schema: analytics
      libraries:
        - file:
            path: ../../src/analytics/customer_contact_dim.py
        - file:
            path: ../../src/analytics/customer_dim.py
        - file:
            path: ../../src/analytics/address_dim.py
        - file:
            path: ../../src/analytics/customer_address_bridge.py
        - file:
            path: ../../src/analytics/product_dim.py
        - file:
            path: ../../src/analytics/product_fct.py
        - file:
            path: ../../src/analytics/order_dim.py
        - file:
            path: ../../src/analytics/order_status_dim.py
        - file:
            path: ../../src/analytics/order_item_fct.py
        - file:
            path: ../../src/analytics/order_fct.py
        - file:
            path: ../../src/analytics/order_return_dim.py
        - file:
            path: ../../src/analytics/return_item_fct.py
        - file:
            path: ../../src/analytics/order_return_fct.py
